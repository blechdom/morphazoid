<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#07090b" />
    <meta name="description" content="Morphazoid Fourier Epicycles - rotating harmonics reconstruct familiar waveforms." /><title>Fourier Epicycles - Morphazoid</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="experiments.css" />
  </head>
  <body class="experiment-page" data-experiment="fourier">
    <header class="masthead"><a class="wordmark" href="./" aria-label="Morphazoid home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>morphazoid</span></a><nav class="tabs" aria-label="Morphazoid main menu"><a class="tab active" href="fourier-epicycles.html" aria-current="page">fourier epicycles</a></nav><label class="mobile-instrument-nav"><span class="sr-only">Instrument</span><select class="mobile-instrument-select" aria-label="Instrument"><option value="fourier-epicycles.html" selected>fourier epicycles</option></select></label><div class="header-actions"><button class="audio-button" id="audioButton" type="button" aria-pressed="false"><span class="audio-dot" aria-hidden="true"></span><span>audio</span><strong id="audioState">off</strong></button><label class="header-level" for="level"><span><b>level</b><output id="levelOut" for="level">42%</output></span><input id="level" aria-label="Master audio level" type="range" min="0" max="0.82" step="0.01" value="0.42" /></label></div></header>
    <main class="shell experiment-shell" id="fourierEpicycles"><section class="stage" aria-label="Fourier Epicycles stage"><div class="stage-wrap" id="stageWrap"><canvas id="stage" tabindex="0" role="img" aria-label="A chain of rotating harmonic vectors draws a reconstructed waveform." aria-describedby="canvasInstructions liveStatus">Fourier vector and waveform display.</canvas><div class="stage-meta" aria-hidden="true"><span id="stageReadout">FOURIER EPICYCLES &middot; SQUARE &middot; AUDIO OFF</span></div><div class="experiment-title" aria-hidden="true"><h1>Fourier Epicycles</h1><small>many sines, one waveform</small></div></div><p class="sr-only" id="canvasInstructions">Every visible vector is also an audible sine partial.</p><p class="sr-only" id="liveStatus" aria-live="polite"></p></section>
      <aside class="panel experiment-panel" aria-label="Fourier Epicycles controls"><section class="group experiment-card" aria-labelledby="experimentTitle"><div class="experiment-card-heading"><h2 class="group-title" id="experimentTitle">Experiment</h2><span class="section-state" id="experimentSummary">analysis &middot; synthesis</span></div><dl class="experiment-meter-grid"><div><dt>Sounding partials</dt><dd id="metricPrimary">6</dd></div><div><dt>RMS error</dt><dd id="metricSecondary">0</dd></div></dl></section>
        <section class="group control-section" aria-labelledby="fourierTitle"><div class="experiment-card-heading"><h2 class="group-title" id="fourierTitle">Series</h2><span class="section-state" id="patternSummary">square series</span></div><div class="group-body">
          <div class="experiment-button-grid" role="group" aria-label="Waveform series"><button type="button" data-fourier-wave="sine" aria-pressed="false">Sine</button><button type="button" data-fourier-wave="square" aria-pressed="true">Square</button><button type="button" data-fourier-wave="triangle" aria-pressed="false">Triangle</button><button type="button" data-fourier-wave="saw" aria-pressed="false">Saw</button></div>
          <label class="control" for="fourierHarmonics"><span><b>Harmonic limit</b><output id="fourierHarmonicsOut" for="fourierHarmonics">12</output></span><input id="fourierHarmonics" type="range" min="1" max="12" step="1" value="12" /></label>
          <label class="control" for="fourierRate"><span><b>Vector rate</b><output id="fourierRateOut" for="fourierRate">0.12 cyc/s</output></span><input id="fourierRate" type="range" min="0.03" max="0.5" step="0.01" value="0.12" /></label>
          <label class="control" for="fourierTone"><span><b>Fundamental</b><output id="fourierToneOut" for="fourierTone">55 Hz</output></span><input id="fourierTone" type="range" min="30" max="180" step="1" value="55" /></label>
        </div></section><div class="reset-all-row"><button class="reset-all-button" type="button" data-reset-all>Reset all parameters</button></div></aside>
    </main><script type="module" src="nav.js"></script><script type="module" src="experiments-app.js"></script>
  </body>
</html>
