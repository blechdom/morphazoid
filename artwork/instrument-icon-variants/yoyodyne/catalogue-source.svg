<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Yoyodyne signal relay lattice</title>
  <desc id="desc">Faceted cyan, violet, and magenta signal relays cross a dark pitch and time grid with faint recall anchors.</desc>
  <defs>
    <radialGradient id="space" cx="68%" cy="28%" r="82%">
      <stop offset="0" stop-color="#2b215c"/>
      <stop offset=".45" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65f7ff"/>
      <stop offset=".54" stop-color="#8e7dff"/>
      <stop offset="1" stop-color="#ff5fce"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-100%" width="260%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="minorGrid" width="32" height="24" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 24" fill="none" stroke="#7692c5" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="44" fill="url(#space)"/>
  <rect x="34" y="42" width="444" height="428" rx="25" fill="#050913" fill-opacity=".62" stroke="#89a3d1" stroke-opacity=".22"/>
  <rect x="55" y="65" width="402" height="380" fill="url(#minorGrid)"/>
