    <path d="M78 357H146M158 307H242M252 337H318M328 223H412"/>
  </g>
  <g fill="none" stroke="#aab9dd" stroke-opacity=".42">
    <path d="M74 353v8m-4-4h8M146 353v8m-4-4h8"/>
    <path d="M154 303v8m-4-4h8M242 303v8m-4-4h8"/>
    <path d="M248 333v8m-4-4h8M318 333v8m-4-4h8"/>
    <path d="M324 219v8m-4-4h8M412 219v8m-4-4h8"/>
