    <path d="M314 211l10-13h88l10 13-10 13h-88z"/>
    <path d="M369 162l10-13h52l10 13-10 13h-52z"/>
  </g>
  <g fill="none" stroke="#07101d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
