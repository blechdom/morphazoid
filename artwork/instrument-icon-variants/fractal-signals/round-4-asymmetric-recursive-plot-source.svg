    <circle cx="105" cy="311" r="2.3"/><circle cx="151" cy="399" r="2.3"/><circle cx="190" cy="238" r="2.3"/>
    <circle cx="360" cy="264" r="2.3"/><circle cx="323" cy="311" r="2.3"/><circle cx="395" cy="129" r="2.3"/>
  </g>
</svg>
