<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Asymmetric recursive mathematical construction">
  <defs>
    <style>
      .curve { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .construction { fill: none; stroke: #dce8e4; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; opacity: .44; }
      .projection { fill: none; stroke: #aabbb7; stroke-width: 4.5; stroke-dasharray: 10 13; stroke-linecap: round; opacity: .66; }
