      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="28" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V28" fill="none" stroke="#dbe4e0" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
