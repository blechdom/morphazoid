<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vocalzoid sample sequencer artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11150d"/>
      <stop offset=".52" stop-color="#070807"/>
      <stop offset="1" stop-color="#170d0b"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="0">
