  <circle cx="400" cy="438" r="47" fill="#f43b05" stroke="#a55bea" stroke-width="4"/>
  <ellipse cx="382" cy="419" rx="8" ry="7" transform="rotate(-38 382 419)" fill="#ffc59e"/>

  <!-- Twelve crooked teeth with the characteristic missing central incisor. -->
  <ellipse cx="400" cy="582" rx="153" ry="66" fill="#09090a"/>
  <g clip-path="url(#mouth-clip)">
    <path d="M285 637Q400 587 511 637L511 660H285Z" fill="#a93165" stroke="#c46597" stroke-width="2"/>
    <path d="M400 621Q418 627 408 644" fill="none" stroke="#d082aa" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
    <g fill="#f3edd7" stroke="#9c7ab9" stroke-width="1.8" stroke-linejoin="round">
      <path d="M301 523L315 522L311 554Q303 557 296 553Z"/>
      <path d="M318 521L331 521L327 555Q320 558 313 554Z"/>
      <path d="M334 520L347 520L343 556Q336 559 330 555Z"/>
      <path d="M350 520L363 520L360 557Q353 560 346 556Z"/>
      <path d="M366 520L379 521L379 557Q372 560 364 556Z"/>
      <path d="M382 521L395 522L401 558Q393 562 386 557Z"/>
      <path d="M417 522L430 521L429 558Q422 561 416 558Z"/>
      <path d="M433 521L446 521L444 558Q437 561 431 557Z"/>
      <path d="M449 521L462 522L459 557Q452 560 446 556Z"/>
      <path d="M465 522L478 523L475 557Q468 559 461 555Z"/>
      <path d="M481 523L494 525L490 556Q483 558 477 554Z"/>
      <path d="M497 525L510 529L507 554Q500 557 494 553Z"/>
