    </filter>
  </defs>

  <!-- Outer Acoustic Aura Rings -->
  <ellipse cx="256" cy="245" rx="195" ry="230" fill="none" stroke="#ff2a85" stroke-width="2.5" stroke-dasharray="6,8" opacity="0.45"/>
  <ellipse cx="256" cy="245" rx="180" ry="218" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-dasharray="6,8" opacity="0.5"/>

  <!-- Sound Breath Energy Whiskers -->
  <line x1="30" y1="240" x2="80" y2="230" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="275" x2="75" y2="275" stroke="#00e5ff" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="30" y1="310" x2="80" y2="320" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>

  <line x1="482" y1="240" x2="432" y2="230" stroke="#ff2a85" stroke-width="6" stroke-linecap="round"/>
  <line x1="492" y1="275" x2="437" y2="275" stroke="#ff2a85" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="482" y1="310" x2="432" y2="320" stroke="#ff2a85" stroke-width="6" stroke-linecap="round"/>

