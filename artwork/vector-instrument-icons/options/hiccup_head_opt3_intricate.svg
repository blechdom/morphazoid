  <circle cx="120" cy="285" r="34" fill="none" stroke="#ff2a85" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
  <circle cx="120" cy="285" r="22" fill="none" stroke="#ff2a85" stroke-width="4"/>
  <circle cx="120" cy="285" r="10" fill="#ff2a85" fill-opacity="0.4"/>

  <circle cx="392" cy="285" r="34" fill="none" stroke="#ffcc00" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
