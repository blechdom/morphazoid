    <rect x="216" y="95" width="20" height="20" fill="#00ffb2"/>
    <rect x="236" y="95" width="20" height="20" fill="#ffcc00"/>
    <rect x="256" y="95" width="20" height="20" fill="#ff2a85"/>
    <rect x="276" y="95" width="20" height="20" fill="#00e5ff"/>
    <rect x="216" y="115" width="20" height="20" fill="#ff2a85"/>
    <rect x="236" y="115" width="20" height="20" fill="#00e5ff"/>
    <rect x="256" y="115" width="20" height="20" fill="#00ffb2"/>
    <rect x="276" y="115" width="20" height="20" fill="#ffcc00"/>
  </g>

  <!-- Expressive Eyebrows -->
  <path d="M 135 150 Q 175 125 215 145" fill="none" stroke="#ffcc00" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 297 145 Q 337 125 377 150" fill="none" stroke="#ffcc00" stroke-width="6.5" stroke-linecap="round"/>

