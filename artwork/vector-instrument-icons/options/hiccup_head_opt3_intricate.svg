  <circle cx="256" cy="388" r="12" fill="#ffffff" filter="url(#glow-hh-int)"/>
  <circle cx="256" cy="388" r="5" fill="#040a08"/>

  <!-- Chin Gesture Sequencer Step Blocks (8 step buttons at jaw) -->
  <g>
    <rect x="156" y="420" width="20" height="10" rx="3" fill="#ff2a85" stroke="#040a08" stroke-width="1.5"/><rect x="181" y="420" width="20" height="10" rx="3" fill="#ffcc00" stroke="#040a08" stroke-width="1.5"/><rect x="206" y="420" width="20" height="10" rx="3" fill="#00ffb2" stroke="#040a08" stroke-width="1.5"/><rect x="231" y="420" width="20" height="10" rx="3" fill="#00e5ff" stroke="#040a08" stroke-width="1.5"/><rect x="256" y="420" width="20" height="10" rx="3" fill="#c79bff" stroke="#040a08" stroke-width="1.5"/><rect x="281" y="420" width="20" height="10" rx="3" fill="#ff2a85" stroke="#040a08" stroke-width="1.5"/><rect x="306" y="420" width="20" height="10" rx="3" fill="#ffcc00" stroke="#040a08" stroke-width="1.5"/><rect x="331" y="420" width="20" height="10" rx="3" fill="#00ffb2" stroke="#040a08" stroke-width="1.5"/>
