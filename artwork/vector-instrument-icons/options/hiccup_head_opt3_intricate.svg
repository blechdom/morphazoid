  <ellipse cx="175" cy="182" rx="38" ry="24" fill="#040a08" stroke="#00e5ff" stroke-width="6"/>
  <circle cx="175" cy="182" r="14" fill="#00e5ff" filter="url(#glow-hh-int)"/>
  <circle cx="175" cy="182" r="6" fill="#ffffff"/>

  <ellipse cx="337" cy="182" rx="38" ry="24" fill="#040a08" stroke="#00e5ff" stroke-width="6"/>
