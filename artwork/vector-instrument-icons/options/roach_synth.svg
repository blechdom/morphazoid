<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-rc" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Long Whisking Antennae (Cyan) -->
  <path d="M 240 135 C 200 60, 110 50, 75 70" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M 272 135 C 312 60, 402 50, 437 70" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>

  <!-- 6 Articulated Jointed Legs (Mint #00ffb2 - 7px bold) -->
  <!-- Front Legs -->
  <polyline points="230,190 145,150 90,120" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="282,190 367,150 422,120" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle Legs -->
  <polyline points="220,250 120,250 65,280" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="292,250 392,250 447,280" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hind Legs (Long jump spurs) -->
  <polyline points="225,320 120,360 80,440" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="287,320 392,360 432,440" fill="none" stroke="#00ffb2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Exoskeleton Head & Pronotum Shield -->
  <ellipse cx="256" cy="155" rx="36" ry="24" fill="#00ffb2" fill-opacity="0.3" stroke="#00ffb2" stroke-width="7"/>
  <circle cx="242" cy="152" r="5" fill="#ffcc00"/>
  <circle cx="270" cy="152" r="5" fill="#ffcc00"/>

  <!-- Segmented Abdominal Shell (Gold & Mint) -->
  <ellipse cx="256" cy="290" rx="55" ry="105" fill="#ffcc00" fill-opacity="0.22" stroke="#ffcc00" stroke-width="8"/>
  <line x1="205" y1="240" x2="307" y2="240" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="202" y1="285" x2="310" y2="285" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="208" y1="330" x2="304" y2="330" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
  <line x1="225" y1="370" x2="287" y2="370" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>

  <!-- Central Voice Core Pulse -->
  <circle cx="256" cy="265" r="14" fill="#ffffff" filter="url(#glow-rc)"/>
</svg>