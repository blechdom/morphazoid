<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-g4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Feedback Arch from Output back to Input -->
  <path d="M 412 256 C 412 80, 100 80, 100 256" fill="none" stroke="#ff2a85" stroke-width="8" stroke-linecap="round"/>
  <polygon points="100,256 82,236 102,234" fill="#ff2a85"/>

  <!-- Diamond Edges -->
  <line x1="100" y1="256" x2="256" y2="130" stroke="#00e5ff" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="256" x2="256" y2="382" stroke="#ffcc00" stroke-width="9" stroke-linecap="round"/>
  <line x1="256" y1="130" x2="412" y2="256" stroke="#00ffb2" stroke-width="9" stroke-linecap="round"/>
  <line x1="256" y1="382" x2="412" y2="256" stroke="#00ffb2" stroke-width="9" stroke-linecap="round"/>
  <line x1="256" y1="130" x2="256" y2="382" stroke="#b85dff" stroke-width="6" stroke-dasharray="10,8"/>

  <!-- Traveling pulse packets -->
  <circle cx="178" cy="193" r="10" fill="#ffffff" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="334" cy="193" r="10" fill="#ffffff" stroke="#00ffb2" stroke-width="3"/>
  <circle cx="334" cy="319" r="10" fill="#ffffff" stroke="#00ffb2" stroke-width="3"/>

  <!-- Left Node (Input) -->
  <circle cx="100" cy="256" r="36" fill="#040a08" stroke="#00e5ff" stroke-width="7"/>
  <circle cx="100" cy="256" r="18" fill="#00e5ff" fill-opacity="0.35"/>
  <circle cx="100" cy="256" r="7" fill="#00e5ff"/>

  <!-- Top Node (VCO / Modulator with Sine) -->
  <circle cx="256" cy="130" r="44" fill="#00ffb2" fill-opacity="0.2" filter="url(#glow-g4)"/>
  <circle cx="256" cy="130" r="38" fill="#040e0b" stroke="#00ffb2" stroke-width="8"/>
  <path d="M 234 130 Q 245 110 256 130 Q 267 150 278 130" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Bottom Node (Resonator / Filter) -->
  <circle cx="256" cy="382" r="36" fill="#040a08" stroke="#ffcc00" stroke-width="7"/>
  <circle cx="256" cy="382" r="18" fill="#ffcc00" fill-opacity="0.35"/>
  <circle cx="256" cy="382" r="7" fill="#ffcc00"/>

  <!-- Right Node (Output / Delay) -->
  <circle cx="412" cy="256" r="38" fill="#040a08" stroke="#ff2a85" stroke-width="8"/>
  <circle cx="412" cy="256" r="20" fill="#ff2a85" fill-opacity="0.35"/>
  <circle cx="412" cy="256" r="8" fill="#ffffff"/>
</svg>