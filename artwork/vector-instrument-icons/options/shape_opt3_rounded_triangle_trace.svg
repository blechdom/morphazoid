<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-sh-tr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Heavy Outer Rounded Triangle Contour (Mint #00ffb2) -->
  <path d="M 256 95 Q 285 105 390 315 Q 415 365 370 380 Q 256 360 142 380 Q 97 365 122 315 Q 227 105 256 95 Z" fill="#00ffb2" fill-opacity="0.16" stroke="#00ffb2" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Perimeter Wire Track (Electric Cyan #00e5ff) -->
  <path d="M 256 95 Q 285 105 390 315 Q 415 365 370 380 Q 256 360 142 380 Q 97 365 122 315 Q 227 105 256 95 Z" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-dasharray="10,8"/>

  <!-- 3 Corner Brass/Amber Posts -->
  <g>
    <circle cx="256" cy="120" r="17" fill="#040a08" stroke="#ffcc00" stroke-width="5"/>
    <circle cx="256" cy="120" r="8" fill="#ffcc00"/>
    <circle cx="256" cy="120" r="3" fill="#ffffff"/>
    
    <circle cx="380" cy="350" r="17" fill="#040a08" stroke="#ffcc00" stroke-width="5"/>
    <circle cx="380" cy="350" r="8" fill="#ffcc00"/>
    <circle cx="380" cy="350" r="3" fill="#ffffff"/>
    
    <circle cx="132" cy="350" r="17" fill="#040a08" stroke="#ffcc00" stroke-width="5"/>
    <circle cx="132" cy="350" r="8" fill="#ffcc00"/>
    <circle cx="132" cy="350" r="3" fill="#ffffff"/>
    </g>

  <!-- Active Orbiting Playhead Bead (Bright White / Gold with radiant glow) -->
  <circle cx="338" cy="210" r="22" fill="#ffcc00" fill-opacity="0.45" filter="url(#glow-sh-tr)"/>
  <circle cx="338" cy="210" r="14" fill="#ffffff" stroke="#ffcc00" stroke-width="4.5"/>
  <circle cx="338" cy="210" r="5" fill="#040a08"/>
</svg>