<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-q1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground Reference Line -->
  <line x1="60" y1="390" x2="452" y2="390" stroke="#00ffb2" stroke-width="6" stroke-dasharray="14,10" stroke-linecap="round"/>

  <!-- Background Right Hind Leg (Push-off Drive, Electric Cyan) -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <polyline points="165,215 105,265 80,328 55,388" fill="none" stroke="#00e5ff" stroke-width="10"/>
    <circle cx="105" cy="265" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/>
    <circle cx="80" cy="328" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/>
    <circle cx="55" cy="388" r="14" fill="#00e5ff" filter="url(#glow-q1)"/>
    <circle cx="55" cy="388" r="5" fill="#ffffff"/>
  </g>

  <!-- Background Right Front Leg (High Reach, Coral Pink) -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <polyline points="340,195 385,245 425,295 452,348" fill="none" stroke="#ff2a85" stroke-width="10"/>
    <circle cx="385" cy="245" r="9" fill="#040a08" stroke="#ff2a85" stroke-width="4"/>
    <circle cx="425" cy="295" r="9" fill="#040a08" stroke="#ff2a85" stroke-width="4"/>
    <circle cx="452" cy="348" r="14" fill="#ff2a85" filter="url(#glow-q1)"/>
    <circle cx="452" cy="348" r="5" fill="#ffffff"/>
  </g>

  <!-- Solid Robotic Torso Chassis -->
  <polygon points="140,238 165,190 345,180 375,215 340,248 165,255" fill="#00ffb2" fill-opacity="0.32" stroke="#00ffb2" stroke-width="8" stroke-linejoin="round"/>
  <!-- Structural Trusses -->
  <line x1="215" y1="188" x2="255" y2="252" stroke="#00e5ff" stroke-width="5"/>
  <line x1="295" y1="183" x2="255" y2="252" stroke="#00e5ff" stroke-width="5"/>
  <line x1="295" y1="183" x2="340" y2="248" stroke="#00e5ff" stroke-width="5"/>
  <line x1="165" y1="190" x2="345" y2="180" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Neck & Sensor Head Pod -->
  <polyline points="345,180 395,128 445,128" fill="none" stroke="#00ffb2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="430,110 475,128 430,146" fill="#ffcc00" stroke="#00ffb2" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="445" cy="128" r="7" fill="#ffffff" filter="url(#glow-q1)"/>

  <!-- Antenna Tail -->
  <path d="M 140 238 C 105 228, 90 178, 72 170" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="72" cy="170" r="9" fill="#ffcc00"/>

  <!-- Foreground Left Hind Leg (Forward Stride Drive, Phosphor Mint) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <polyline points="165,215 140,275 178,335 205,388" fill="none" stroke="#00ffb2" stroke-width="12"/>
    <circle cx="140" cy="275" r="12" fill="#040a08" stroke="#00ffb2" stroke-width="5"/>
    <circle cx="140" cy="275" r="4.5" fill="#00ffb2"/>
    <circle cx="178" cy="335" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="5"/>
    <!-- Mint Stance Foot -->
    <circle cx="205" cy="388" r="17" fill="#00ffb2" filter="url(#glow-q1)"/>
    <circle cx="205" cy="388" r="6.5" fill="#ffffff"/>
  </g>

  <!-- Foreground Left Front Leg (Grounded Stance, Warm Gold) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <polyline points="340,195 358,262 338,332 318,388" fill="none" stroke="#ffcc00" stroke-width="12"/>
    <circle cx="358" cy="262" r="12" fill="#040a08" stroke="#ffcc00" stroke-width="5"/>
    <circle cx="358" cy="262" r="4.5" fill="#ffcc00"/>
    <circle cx="338" cy="332" r="11" fill="#040a08" stroke="#ffcc00" stroke-width="5"/>
    <!-- Gold Stance Foot -->
    <circle cx="318" cy="388" r="18" fill="#ffcc00" filter="url(#glow-q1)"/>
    <circle cx="318" cy="388" r="7" fill="#ffffff"/>
  </g>

  <!-- Heavy Pivot Shoulder & Hip Hubs -->
  <circle cx="165" cy="215" r="18" fill="#040a08" stroke="#00ffb2" stroke-width="6"/>
  <circle cx="165" cy="215" r="8" fill="#00ffb2"/>

  <circle cx="340" cy="195" r="18" fill="#040a08" stroke="#00ffb2" stroke-width="6"/>
  <circle cx="340" cy="195" r="8" fill="#ffcc00"/>
</svg>