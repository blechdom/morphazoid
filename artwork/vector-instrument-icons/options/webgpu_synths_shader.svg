<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-shd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Code Brackets < / > (Mint & Cyan) -->
  <polyline points="135,160 70,256 135,352" fill="none" stroke="#00ffb2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="377,160 442,256 377,352" fill="none" stroke="#00ffb2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Raymarched Shader Plasma Sphere (Violet & Coral) -->
  <circle cx="256" cy="256" r="95" fill="#b85dff" fill-opacity="0.25" stroke="#00e5ff" stroke-width="8"/>
  <circle cx="256" cy="256" r="65" fill="#ff2a85" fill-opacity="0.35" stroke="#ff2a85" stroke-width="6"/>

  <!-- Audio Waveform Modulating the Shader Sphere -->
  <path d="M 185 256 Q 220 205 256 256 Q 292 307 327 256" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" filter="url(#glow-shd)"/>
  <circle cx="256" cy="256" r="10" fill="#ffcc00"/>
</svg>