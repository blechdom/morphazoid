<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-hh1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sound Breath Whiskers (Left & Right) -->
  <line x1="45" y1="260" x2="85" y2="250" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="290" x2="80" y2="290" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="45" y1="320" x2="85" y2="330" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>

  <line x1="467" y1="260" x2="427" y2="250" stroke="#ff2a85" stroke-width="6" stroke-linecap="round"/>
  <line x1="472" y1="290" x2="432" y2="290" stroke="#ff2a85" stroke-width="6" stroke-linecap="round"/>
  <line x1="467" y1="320" x2="427" y2="330" stroke="#ff2a85" stroke-width="6" stroke-linecap="round"/>

  <!-- Face Contour (Phosphor Mint #00ffb2) -->
  <ellipse cx="256" cy="245" rx="165" ry="205" fill="#00ffb2" fill-opacity="0.15" stroke="#00ffb2" stroke-width="11"/>

  <!-- Eyebrows -->
  <path d="M 140 145 Q 175 125 210 145" fill="none" stroke="#ffcc00" stroke-width="6" stroke-linecap="round"/>
  <path d="M 302 145 Q 337 125 372 145" fill="none" stroke="#ffcc00" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes (Almond/Round Cyan with glowing pupil) -->
  <ellipse cx="175" cy="180" rx="36" ry="22" fill="#040a08" stroke="#00e5ff" stroke-width="6"/>
  <circle cx="175" cy="180" r="10" fill="#00e5ff" filter="url(#glow-hh1)"/>
  <circle cx="175" cy="180" r="4" fill="#ffffff"/>

  <ellipse cx="337" cy="180" rx="36" ry="22" fill="#040a08" stroke="#00e5ff" stroke-width="6"/>
  <circle cx="337" cy="180" r="10" fill="#00e5ff" filter="url(#glow-hh1)"/>
  <circle cx="337" cy="180" r="4" fill="#ffffff"/>

  <!-- Cheek Acoustic Resonance Circles -->
  <circle cx="125" cy="275" r="26" fill="none" stroke="#ff2a85" stroke-width="4.5" stroke-dasharray="6,6" opacity="0.8"/>
  <circle cx="125" cy="275" r="12" fill="#ff2a85" fill-opacity="0.3"/>

  <circle cx="387" cy="275" r="26" fill="none" stroke="#ffcc00" stroke-width="4.5" stroke-dasharray="6,6" opacity="0.8"/>
  <circle cx="387" cy="275" r="12" fill="#ffcc00" fill-opacity="0.3"/>

  <!-- Nose (Central Stylized Airway Wedge) -->
