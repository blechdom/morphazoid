  <circle cx="256" cy="252" r="3.5" fill="#00ffb2"/>

  <!-- Open Smiling Mouth (Deep cavity with teeth & tongue) -->
  <!-- Outer lips -->
  <path d="M 160 325 Q 256 310 352 325 Q 375 390 256 415 Q 137 390 160 325 Z" fill="#040e0b" stroke="#ff2a85" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Upper Teeth White Arch -->
  <path d="M 175 330 Q 256 320 337 330 Q 320 355 256 355 Q 192 355 175 330 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>

  <!-- Vibrating Tongue Pad (Bright Coral/Gold) -->
