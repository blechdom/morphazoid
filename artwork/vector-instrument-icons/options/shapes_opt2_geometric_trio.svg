<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-s2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="180" fill="#00ffb2" fill-opacity="0.1" stroke="#00ffb2" stroke-width="8.5"/>

  <!-- Inscribed Square rotated 45 deg -->
  <rect x="126.0" y="126.0" width="260" height="260" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="7" rx="8" transform="rotate(45 256 256)"/>

  <!-- Inscribed Triangle -->
  <polygon points="256.0,61.0 424.9,353.5 87.1,353.5" fill="#ffcc00" fill-opacity="0.2" stroke="#ffcc00" stroke-width="8" stroke-linejoin="round"/>

  <!-- Slicing Scanline with pulse points -->
  <line x1="60" y1="330" x2="452" y2="182" stroke="#ff2a85" stroke-width="7" stroke-linecap="round"/>
  
  <circle cx="155" cy="294" r="16" fill="#ffcc00" filter="url(#glow-s2)"/>
  <circle cx="155" cy="294" r="8" fill="#ffffff"/>

  <circle cx="357" cy="218" r="16" fill="#00e5ff" filter="url(#glow-s2)"/>
  <circle cx="357" cy="218" r="8" fill="#ffffff"/>

  <circle cx="256" cy="256" r="12" fill="#040a08" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>
</svg>