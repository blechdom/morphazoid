<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-hr2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 4D Connecting Hyper-Ribbons (Violet) -->
  <line x1="105" y1="105" x2="195" y2="195" stroke="#b85dff" stroke-width="9" stroke-linecap="round"/>
  <line x1="407" y1="105" x2="317" y2="195" stroke="#b85dff" stroke-width="9" stroke-linecap="round"/>
  <line x1="407" y1="407" x2="317" y2="317" stroke="#b85dff" stroke-width="9" stroke-linecap="round"/>
  <line x1="105" y1="407" x2="195" y2="317" stroke="#b85dff" stroke-width="9" stroke-linecap="round"/>

  <!-- Outer Cube with 2x2 multi-color Rubik's facets -->
  <polygon points="105,105 256,105 256,256 105,256" fill="#00ffb2" fill-opacity="0.3" stroke="#00ffb2" stroke-width="7"/>
  <polygon points="256,105 407,105 407,256 256,256" fill="#ffcc00" fill-opacity="0.3" stroke="#ffcc00" stroke-width="7"/>
  <polygon points="105,256 256,256 256,407 105,407" fill="#00e5ff" fill-opacity="0.3" stroke="#00e5ff" stroke-width="7"/>
  <polygon points="256,256 407,256 407,407 256,407" fill="#ff2a85" fill-opacity="0.3" stroke="#ff2a85" stroke-width="7"/>

  <!-- Inner Cube with inverted 4D facet colors -->
  <polygon points="195,195 256,195 256,256 195,256" fill="#ff2a85" stroke="#ffffff" stroke-width="5"/>
  <polygon points="256,195 317,195 317,256 256,256" fill="#00e5ff" stroke="#ffffff" stroke-width="5"/>
  <polygon points="195,256 256,256 256,317 195,317" fill="#ffcc00" stroke="#ffffff" stroke-width="5"/>
  <polygon points="256,256 317,256 317,317 256,317" fill="#00ffb2" stroke="#ffffff" stroke-width="5"/>

  <!-- Outer 4D Vertices -->
  <circle cx="105" cy="105" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/>
  <circle cx="407" cy="105" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/>
  <circle cx="407" cy="407" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/>
  <circle cx="105" cy="407" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/>

  <!-- 4D Hyper-Fold Center Spark -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow-hr2)"/>
  <circle cx="256" cy="256" r="6" fill="#040a08"/>
</svg>