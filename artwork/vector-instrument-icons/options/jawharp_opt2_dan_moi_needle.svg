<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-jh2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Radiating Acoustic Waves -->
  <path d="M 430 180 A 85 85 0 0 1 430 332" fill="none" stroke="#ff2a85" stroke-width="5" stroke-dasharray="8,8" opacity="0.6"/>
  <path d="M 430 135 A 130 130 0 0 1 430 377" fill="none" stroke="#ff2a85" stroke-width="4.5" stroke-dasharray="10,10" opacity="0.4"/>

  <!-- Tapered Brass Dan Moi Body (Phosphor Mint & Gold) -->
  <polygon points="50,225 390,242 390,270 50,287" fill="#00ffb2" fill-opacity="0.3" stroke="#00ffb2" stroke-width="9" stroke-linejoin="round"/>
  
  <!-- Narrow Slit for Reed -->
  <line x1="120" y1="256" x2="390" y2="256" stroke="#040a08" stroke-width="12" stroke-linecap="round"/>

  <!-- Vibrating Steel Tongue Reed -->
  <line x1="80" y1="256" x2="435" y2="256" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="435" y2="256" stroke="#00e5ff" stroke-width="14" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Bent Plucking Trigger Pin (Gold) -->
  <polyline points="435,256 445,210 475,210" fill="none" stroke="#ffcc00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="475" cy="210" r="16" fill="#ffcc00" fill-opacity="0.4" filter="url(#glow-jh2)"/>
  <circle cx="475" cy="210" r="9" fill="#ffffff" stroke="#ffcc00" stroke-width="3.5"/>

  <!-- Handle Mount Rivets -->
  <circle cx="85" cy="256" r="12" fill="#040a08" stroke="#ffcc00" stroke-width="4"/>
  <circle cx="85" cy="256" r="4.5" fill="#ffcc00"/>
  <circle cx="135" cy="256" r="10" fill="#040a08" stroke="#00e5ff" stroke-width="3.5"/>
  <circle cx="135" cy="256" r="3.5" fill="#00e5ff"/>
</svg>