<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow-h2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 4D Hyperplane Slicing Arc -->
  <line x1="70" y1="360" x2="442" y2="152" stroke="#ff2a85" stroke-width="6.5" stroke-dasharray="12,8" stroke-linecap="round"/>

  <!-- Outer Cube Isometric Hexagon -->
  <polygon points="256.0,66.0 420.5,161.0 420.5,351.0 256.0,446.0 91.5,351.0 91.5,161.0" fill="#00ffb2" fill-opacity="0.14" stroke="#00ffb2" stroke-width="9" stroke-linejoin="round"/>
  <line x1="256" y1="256" x2="256.0" y2="66.0" stroke="#00ffb2" stroke-width="8.5"/><line x1="256" y1="256" x2="420.5" y2="351.0" stroke="#00ffb2" stroke-width="8.5"/><line x1="256" y1="256" x2="91.5" y2="351.0" stroke="#00ffb2" stroke-width="8.5"/>

  <!-- Connecting 4D Struts (Violet) -->
  <line x1="256.0" y1="161.0" x2="256.0" y2="66.0" stroke="#b85dff" stroke-width="8.5"/><line x1="338.3" y1="208.5" x2="420.5" y2="161.0" stroke="#b85dff" stroke-width="8.5"/><line x1="338.3" y1="303.5" x2="420.5" y2="351.0" stroke="#b85dff" stroke-width="8.5"/><line x1="256.0" y1="351.0" x2="256.0" y2="446.0" stroke="#b85dff" stroke-width="8.5"/><line x1="173.7" y1="303.5" x2="91.5" y2="351.0" stroke="#b85dff" stroke-width="8.5"/><line x1="173.7" y1="208.5" x2="91.5" y2="161.0" stroke="#b85dff" stroke-width="8.5"/>

  <!-- Inner Cube Isometric Hexagon -->
  <polygon points="256.0,161.0 338.3,208.5 338.3,303.5 256.0,351.0 173.7,303.5 173.7,208.5" fill="#00e5ff" fill-opacity="0.28" stroke="#00e5ff" stroke-width="9" stroke-linejoin="round"/>
  <line x1="256" y1="256" x2="256.0" y2="161.0" stroke="#00e5ff" stroke-width="8.5"/><line x1="256" y1="256" x2="338.3" y2="303.5" stroke="#00e5ff" stroke-width="8.5"/><line x1="256" y1="256" x2="173.7" y2="303.5" stroke="#00e5ff" stroke-width="8.5"/>

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="14" fill="#040a08" stroke="#00e5ff" stroke-width="4.5"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>

  <!-- Outer Vertices -->
  <circle cx="256.0" cy="66.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="256.0" cy="66.0" r="4" fill="#ffffff"/><circle cx="420.5" cy="161.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="420.5" cy="161.0" r="4" fill="#ffffff"/><circle cx="420.5" cy="351.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="420.5" cy="351.0" r="4" fill="#ffffff"/><circle cx="256.0" cy="446.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="256.0" cy="446.0" r="4" fill="#ffffff"/><circle cx="91.5" cy="351.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="91.5" cy="351.0" r="4" fill="#ffffff"/><circle cx="91.5" cy="161.0" r="11" fill="#040a08" stroke="#00ffb2" stroke-width="4.5"/><circle cx="91.5" cy="161.0" r="4" fill="#ffffff"/>

  <!-- Inner Vertices -->
  <circle cx="256.0" cy="161.0" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="256.0" cy="161.0" r="3" fill="#ffcc00"/><circle cx="338.3" cy="208.5" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="338.3" cy="208.5" r="3" fill="#ffcc00"/><circle cx="338.3" cy="303.5" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="338.3" cy="303.5" r="3" fill="#ffcc00"/><circle cx="256.0" cy="351.0" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="256.0" cy="351.0" r="3" fill="#ffcc00"/><circle cx="173.7" cy="303.5" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="173.7" cy="303.5" r="3" fill="#ffcc00"/><circle cx="173.7" cy="208.5" r="9" fill="#040a08" stroke="#00e5ff" stroke-width="4"/><circle cx="173.7" cy="208.5" r="3" fill="#ffcc00"/>

  <!-- Slicing Intercepts -->
  <circle cx="163" cy="308" r="18" fill="#ffcc00" fill-opacity="0.4" filter="url(#glow-h2)"/>
  <circle cx="163" cy="308" r="10" fill="#ffffff" stroke="#ffcc00" stroke-width="4"/>

  <circle cx="349" cy="204" r="18" fill="#ffcc00" fill-opacity="0.4" filter="url(#glow-h2)"/>
  <circle cx="349" cy="204" r="10" fill="#ffffff" stroke="#ffcc00" stroke-width="4"/>
</svg>