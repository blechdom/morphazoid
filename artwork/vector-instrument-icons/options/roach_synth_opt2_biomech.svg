  <path d="M 246 257 Q 251 245 256 257 Q 261 269 266 257" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-rc2)"/>

  <!-- Acoustic Abdominal Speaker Grille at base -->
