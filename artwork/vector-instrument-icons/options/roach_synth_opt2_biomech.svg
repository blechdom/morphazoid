  <circle cx="110" cy="380" r="8" fill="#040a08" stroke="#ffcc00" stroke-width="3.5"/>

  <polyline points="297,335 402,380 442,455" fill="none" stroke="#00ffb2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
