  </defs>

  <!-- Antenna Feelers with Glowing Tips (Cyan) -->
  <path d="M 230 115 C 190 40, 100 35, 60 55" fill="none" stroke="#00e5ff" stroke-width="6" stroke-linecap="round"/>
