  <!-- Left Speaker Eye (Sine) -->
  <circle cx="232" cy="140" r="16" fill="#040a08" stroke="#00e5ff" stroke-width="3.5"/>
  <path d="M 222 140 Q 227 132 232 140 Q 237 148 242 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Speaker Eye (Sine) -->
  <circle cx="280" cy="140" r="16" fill="#040a08" stroke="#00e5ff" stroke-width="3.5"/>
  <path d="M 270 140 Q 275 132 280 140 Q 285 148 290 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Abdominal Shell Body (Coral & Gold) -->
