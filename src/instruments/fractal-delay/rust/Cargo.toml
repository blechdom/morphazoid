[package]
name = "fractal-delay-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bidirectional waveguide graph for Julia and Mandelbrot geometry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
