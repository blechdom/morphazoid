[package]
name = "l-system-delay-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Playable local L-system Delay with Rust CPAL audio and adaptive polyphony"

[dependencies]
l-system-delay-core = { path = "../core" }
cpal = "0.16"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
