name: Public agent context safety

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  reject-private-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test public privacy guard
        run: python3 -m unittest discover -s tests -p test_agent_privacy_audit.py -v
      - name: Reject private notes and provider stores in public Git
        run: python3 scripts/agent-privacy-audit.py audit --scope forbidden
