name: Agent memory safety

on:
  push:
    branches: [main, "agent-memory/**"]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/skills/**"
      - "docs/agent-context/**"
      - "docs/agent-memory/**"
      - "scripts/agent-memory.py"
      - "tests/test_agent_memory.py"
      - ".github/workflows/agent-memory.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".agents/skills/**"
      - "docs/agent-context/**"
      - "docs/agent-memory/**"
      - "scripts/agent-memory.py"
      - "tests/test_agent_memory.py"
      - ".github/workflows/agent-memory.yml"

permissions:
  contents: read

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test private-first updater
        run: python3 -m unittest discover -s tests -p test_agent_memory.py -v
      - name: Reject unsafe or malformed tracked observations
        run: python3 scripts/agent-memory.py audit --scope notes
