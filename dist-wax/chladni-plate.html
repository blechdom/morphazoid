<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="wax/wax-host-bootstrap.js" data-morphazoid-wax-bootstrap></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090b" />
    <meta
      name="description"
      content="Morphazoid Chladni Plate - nodal plate modes visualized and sounded as modal partials."
    />
    <title>Chladni Plate - Morphazoid</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="experiments.css" />
  </head>
  <body class="experiment-page" data-experiment="chladni">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="Morphazoid home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>morphazoid</span>
      </a>

      <nav class="tabs" aria-label="Instrument">
        <a class="tab" href="shape.html">shape</a>
        <a class="tab active" href="chladni-plate.html" aria-current="page">chladni plate</a>
      </nav>
      <label class="mobile-instrument-nav">
        <span class="sr-only">Instrument</span>
        <select class="mobile-instrument-select" aria-label="Instrument">
          <option value="shape.html">shape</option>
          <option value="chladni-plate.html" selected>chladni plate</option>
        </select>
      </label>

      <div class="audio-strip" aria-label="Audio controls">
        <button class="audio-button" id="audioButton" type="button" aria-pressed="false">
          <span class="audio-glyph" aria-hidden="true">◉</span>
          <span class="audio-copy"><b>Audio</b><small id="audioState">off</small></span>
        </button>
        <label class="header-level" for="level">
          <span><b>Master level</b><output id="levelOut" for="level">42%</output></span>
          <input id="level" aria-label="Master audio level" type="range" min="0" max="0.82" step="0.01" value="0.42" />
        </label>
      </div>
    </header>

    <main class="shell experiment-shell" id="chladniPlate">
      <section class="stage" aria-label="Chladni Plate stage">
        <div class="stage-wrap" id="stageWrap">
          <canvas
            id="stage"
            tabindex="0"
            role="img"
            aria-label="A vibrating square plate shows bright nodal curves for the selected mode."
            aria-describedby="canvasInstructions liveStatus"
          >
            Chladni nodal lines on a square plate.
          </canvas>
          <div class="stage-meta" aria-hidden="true">
            <span id="stageReadout">CHLADNI PLATE · MODE 3:2 · AUDIO OFF</span>
          </div>
          <div class="experiment-title" aria-hidden="true">
            <h1>Chladni Plate</h1>
            <small id="stageCaption">standing waves on a square plate</small>
          </div>
        </div>
        <p class="sr-only" id="canvasInstructions">Animated Chladni nodal pattern.</p>
        <p class="sr-only" id="liveStatus" aria-live="polite"></p>
      </section>

      <aside class="panel experiment-panel" aria-label="Chladni Plate controls">
        <section class="group experiment-card" aria-labelledby="experimentTitle">
          <div class="experiment-card-heading">
            <h2 class="group-title" id="experimentTitle">Experiment</h2>
            <span class="section-state" id="experimentSummary">acoustics · modes</span>
          </div>
          <dl class="experiment-meter-grid">
            <div><dt>Modal frequency</dt><dd id="metricPrimary">180 Hz</dd></div>
            <div><dt>Excitation</dt><dd id="metricSecondary">74%</dd></div>
          </dl>
        </section>

        <section class="group control-section" aria-labelledby="chladniModeTitle">
          <div class="experiment-card-heading">
            <h2 class="group-title" id="chladniModeTitle">Mode</h2>
            <span class="section-state" id="patternSummary">3 by 2</span>
          </div>
          <div class="group-body">
            <label class="control" for="chladniN">
              <span><b>X mode</b><output id="chladniNOut" for="chladniN">3</output></span>
              <input id="chladniN" type="range" min="1" max="8" step="1" value="3" />
            </label>
            <label class="control" for="chladniM">
              <span><b>Y mode</b><output id="chladniMOut" for="chladniM">2</output></span>
              <input id="chladniM" type="range" min="1" max="8" step="1" value="2" />
            </label>
            <label class="control" for="excitationX">
              <span><b>Excite X</b><output id="excitationXOut" for="excitationX">62%</output></span>
              <input id="excitationX" type="range" min="0.02" max="0.98" step="0.01" value="0.62" />
            </label>
            <label class="control" for="excitationY">
              <span><b>Excite Y</b><output id="excitationYOut" for="excitationY">37%</output></span>
              <input id="excitationY" type="range" min="0.02" max="0.98" step="0.01" value="0.37" />
            </label>
            <label class="control" for="chladniDrive">
              <span><b>Bow pressure</b><output id="chladniDriveOut" for="chladniDrive">68%</output></span>
              <input id="chladniDrive" type="range" min="0" max="1" step="0.01" value="0.68" />
            </label>
          </div>
        </section>

        <div class="reset-all-row">
          <button class="reset-all-button" type="button" data-reset-all>Reset all parameters</button>
        </div>
      </aside>
    </main>

    <script type="module" src="nav.js"></script>
    <script type="module" src="experiments-app.js"></script>
    <script type="module" src="wax/wax-universal-adapter.js" data-morphazoid-wax-universal-adapter></script>
</body>
</html>
