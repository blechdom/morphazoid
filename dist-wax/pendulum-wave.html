<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="wax/wax-host-bootstrap.js" data-morphazoid-wax-bootstrap></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#07090b" />
    <meta name="description" content="Morphazoid Pendulum Wave - neighboring periods form audible phase waves." /><title>Pendulum Wave - Morphazoid</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="experiments.css" />
  </head>
  <body class="experiment-page" data-experiment="pendulums">
    <header class="masthead"><a class="wordmark" href="./" aria-label="Morphazoid home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>morphazoid</span></a><nav class="tabs" aria-label="Morphazoid main menu"><a class="tab active" href="pendulum-wave.html" aria-current="page">pendulum wave</a></nav><label class="mobile-instrument-nav"><span class="sr-only">Instrument</span><select class="mobile-instrument-select" aria-label="Instrument"><option value="pendulum-wave.html" selected>pendulum wave</option></select></label><div class="header-actions"><button class="audio-button" id="audioButton" type="button" aria-pressed="false"><span class="audio-dot" aria-hidden="true"></span><span>audio</span><strong id="audioState">off</strong></button><label class="header-level" for="level"><span><b>level</b><output id="levelOut" for="level">45%</output></span><input id="level" aria-label="Master audio level" type="range" min="0" max="0.82" step="0.01" value="0.45" /></label></div></header>
    <main class="shell experiment-shell" id="pendulumWave"><section class="stage" aria-label="Pendulum Wave stage"><div class="stage-wrap" id="stageWrap"><canvas id="stage" tabindex="0" role="img" aria-label="Pendulums with neighboring periods separate into waves and reunite." aria-describedby="canvasInstructions liveStatus">Pendulum phase wave.</canvas><div class="stage-meta" aria-hidden="true"><span id="stageReadout">PENDULUM WAVE &middot; 16 BOBS &middot; AUDIO OFF</span></div><div class="experiment-title" aria-hidden="true"><h1>Pendulum Wave</h1><small>phase drift and recurrence</small></div></div><p class="sr-only" id="canvasInstructions">Each bob sounds when it crosses the center line.</p><p class="sr-only" id="liveStatus" aria-live="polite"></p></section>
      <aside class="panel experiment-panel" aria-label="Pendulum Wave controls"><section class="group experiment-card" aria-labelledby="experimentTitle"><div class="experiment-card-heading"><h2 class="group-title" id="experimentTitle">Experiment</h2><span class="section-state" id="experimentSummary">periodicity &middot; phase</span></div><dl class="experiment-meter-grid"><div><dt>Coherence</dt><dd id="metricPrimary">100%</dd></div><div><dt>Next reunion</dt><dd id="metricSecondary">30 s</dd></div></dl></section>
        <section class="group control-section" aria-labelledby="pendulumTitle"><div class="experiment-card-heading"><h2 class="group-title" id="pendulumTitle">Pendulums</h2><span class="section-state" id="patternSummary">16 periods</span></div><div class="group-body">
          <label class="control" for="pendulumCount"><span><b>Bob count</b><output id="pendulumCountOut" for="pendulumCount">16</output></span><input id="pendulumCount" type="range" min="6" max="24" step="1" value="16" /></label>
          <label class="control" for="pendulumRephase"><span><b>Reunion time</b><output id="pendulumRephaseOut" for="pendulumRephase">30 s</output></span><input id="pendulumRephase" type="range" min="10" max="60" step="1" value="30" /></label>
          <label class="control" for="pendulumStep"><span><b>Cycle spacing</b><output id="pendulumStepOut" for="pendulumStep">1 cycle</output></span><input id="pendulumStep" type="range" min="1" max="3" step="1" value="1" /></label>
          <label class="control" for="pendulumSwing"><span><b>Swing angle</b><output id="pendulumSwingOut" for="pendulumSwing">24 deg</output></span><input id="pendulumSwing" type="range" min="5" max="42" step="1" value="24" /></label>
          <label class="control" for="pendulumTone"><span><b>Lowest bob</b><output id="pendulumToneOut" for="pendulumTone">72 Hz</output></span><input id="pendulumTone" type="range" min="48" max="180" step="1" value="72" /></label>
        </div></section><div class="reset-all-row"><button class="reset-all-button" type="button" data-reset-all>Reset all parameters</button></div></aside>
    </main><script type="module" src="nav.js"></script><script type="module" src="experiments-app.js"></script>
    <script type="module" src="wax/wax-universal-adapter.js" data-morphazoid-wax-universal-adapter></script>
</body>
</html>
