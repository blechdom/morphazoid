    <title>Spelling Synthesizer — Morphazoid</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/instruments/spelling-synthesizer/spelling-synthesizer.css" />
    <link rel="stylesheet" href="src/ui/patterns/performance-workspace.css" />
  <link rel="stylesheet" href="src/families/speech/native-controls.css" />
</head>
  <body class="spelling-synthesizer-page" data-cooking>
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="Morphazoid home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>morphazoid</span>
      </a>

      <nav class="tabs" aria-label="Instrument">
        <a class="tab" href="voicesaurus.html">voicesaurus</a>
        <a class="tab" href="throatazoid.html">throatazoid</a>
        <a
          class="tab active"
          href="spelling-synthesizer.html"
          aria-current="page"
        >spelling synthesizer</a>
      </nav>

      <label class="mobile-instrument-nav">
        <span class="sr-only">Instrument</span>
        <select class="mobile-instrument-select" aria-label="Instrument">
          <option value="voicesaurus.html">voicesaurus</option>
          <option value="throatazoid.html">throatazoid</option>
          <option value="spelling-synthesizer.html" selected>spelling synthesizer</option>
        </select>
      </label>

      <div class="audio-strip" aria-label="Audio controls">
        <button class="audio-button" id="audioButton" type="button" aria-pressed="false">
          <span class="audio-glyph spelling-audio-glyph" aria-hidden="true">Aa</span>
          <span class="audio-copy"><b>Voice</b><small id="audioState">off</small></span>
        </button>
        <label class="header-level" for="level">
          <span><b>Output</b><output id="levelOut" for="level">46%</output></span>
          <input
            id="level"
            aria-label="Spelling Synthesizer output level"
            type="range"
            min="0"
            max="0.82"
            step="0.01"
            value="0.46"
          />
        </label>
      </div>
    </header>

    <main class="spelling-shell" id="spellingSynthesizer" data-cooking-shell>
      <section class="spelling-composer" aria-labelledby="spellingTitle" data-cooking-stage>
        <header class="spelling-heading">
          <h1 id="spellingTitle">Spelling Synthesizer</h1>
        </header>

        <div class="spelling-voice-stage" id="voiceStage" role="img" aria-label="Front-facing wireframe mouth, resting">
          <svg class="spelling-mouth" id="mouthGraphic" viewBox="0 0 1000 520" aria-hidden="true">
            <defs><clipPath id="mouthOpening"><path id="mouthClip" /></clipPath></defs>
            <path id="mouthOutline" class="mouth-opening" />
            <g clip-path="url(#mouthOpening)">
              <path id="mouthCavity" class="mouth-cavity" />
              <path id="mouthTeeth" class="mouth-teeth" />
              <path id="mouthTongue" class="mouth-tongue" />
            </g>
            <path id="mouthLips" class="mouth-lips" />
          </svg>
          <span class="spelling-current-letter" id="currentLetter">A</span>
          <span class="sr-only" id="currentSound">AE</span>
          <span class="sr-only" id="currentPair">READY</span>
        </div>

        <div class="spelling-editor">
          <label class="spelling-input-wrap" for="spellingInput">
            <span class="spelling-input-label"><b>Type into the voice</b></span>
            <textarea id="spellingInput" rows="3" spellcheck="false" autocapitalize="sentences" autocomplete="off" maxlength="1600" placeholder="Start typing…"></textarea>
          </label>
          <div class="spelling-transport">
            <button class="play-button" id="readbackButton" type="button" aria-pressed="false" aria-label="Read it back to me" title="Read it back to me" data-primary-transport>
              <svg class="transport-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 18 12 8 18.5Z" /></svg>
              <svg class="transport-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12" /></svg>
            </button>
            <button class="mini-action spelling-loop-button" id="readbackLoop" type="button" aria-pressed="false" aria-label="Loop readback" title="Loop readback: off">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 7H7a4 4.5 0 0 0-4 4.5M6 17h11a4 4.5 0 0 0 4-4.5M15 4l3 3-3 3M9 14l-3 3 3 3" /></svg>
            </button>
            <label class="spelling-readback-speed" for="readbackSpeed">
              <span>Speed <output id="readbackSpeedOut" for="readbackSpeed">1.00×</output></span>
              <input id="readbackSpeed" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Readback speed" title="Readback pace: half to double speed, without changing pitch" />
            </label>
            <button class="mini-action" id="readbackStartOver" type="button" hidden>Start over</button>
            <button class="mini-action" id="clearButton" type="button">Clear text</button>
          </div>
        </div>
      </section>

      <aside class="spelling-panel" aria-label="Spelling Synthesizer controls" data-cooking-panel>
        <div data-instrument-preset-host></div>
        <section class="spelling-control-block" aria-labelledby="engineLabel">
          <header>
            <span><b id="engineLabel">Synth engine</b></span>
          </header>
          <div class="spelling-engine-buttons" id="engineButtons" role="group" aria-labelledby="engineLabel">
            <button type="button" data-engine="tube" aria-pressed="false">
              <span><b>Pinkazoid</b><small>vocal tract</small></span>
            </button>
            <button type="button" data-engine="diphone" aria-pressed="true">
              <span><b>KAL samples</b><small>sample voice</small></span>
            </button>
            <button type="button" data-engine="vocoder" aria-pressed="false">
              <span><b>Voxazoid</b><small>vocoder</small></span>
            </button>
            <button type="button" data-engine="bell" aria-pressed="false" title="Kelly–Lochbaum vocal tract, inspired by Bell Labs; not the original Daisy Bell program">
              <span><b>Bell Labs</b><small>vocal tract</small></span>
            </button>
            <button type="button" data-engine="lpc" aria-pressed="false" title="Speak &amp; Spell-inspired LPC; not a TI chip or ROM emulator">
              <span><b>Speak &amp; Spell</b><small>LPC synthesis</small></span>
            </button>
            <button type="button" data-engine="espeak" aria-pressed="false" title="eSpeak NG English speech, generated locally in your browser">
              <span><b>eSpeak NG</b><small>formant synthesis</small></span>
            </button>
            <button type="button" data-engine="espeak-klatt" aria-pressed="false" title="eSpeak NG's Klatt synthesizer; not DECtalk">
              <span><b>Klatt</b><small>eSpeak formants</small></span>
            </button>
            <button type="button" data-engine="flite-slt" aria-pressed="false"><span><b>Flite SLT</b><small>statistical voice</small></span></button>
            <button type="button" data-engine="flite-awb" aria-pressed="false"><span><b>Flite AWB</b><small>statistical voice</small></span></button>
            <button type="button" data-engine="flite-rms" aria-pressed="false"><span><b>Flite RMS</b><small>statistical voice</small></span></button>
          <button type="button" data-engine="gnuspeech" aria-pressed="false"><b>Gnuspeech</b><small>Articulatory synthesis</small></button>






<button type="button" data-engine="pico" aria-pressed="false"><b>Pico</b><small>Compact parametric text-to-speech</small></button><button type="button" data-engine="hts" aria-pressed="false"><b>HTS</b><small>HMM speech</small></button></div>
        </section>

        <div id="nativeVoiceControls" class="voice-native-controls" aria-label="Native voice parameters" hidden></div>
        <section class="spelling-control-block" aria-labelledby="personalityLabel">
          <header>
            <span><b id="personalityLabel">Sample tone</b><small id="personalityNote">Tone only; KAL keeps its recorded voice.</small></span>
          </header>
          <div
            class="spelling-personality-buttons"
            id="personalityButtons"
            role="group"
            aria-labelledby="personalityLabel"
          >
            <button type="button" data-personality="clear" aria-pressed="true">
              <b>Clear</b><small>plain + centered</small>
            </button>
            <button type="button" data-personality="warm" aria-pressed="false">
              <b>Velvet</b><small>low + rounded</small>
            </button>
            <button type="button" data-personality="whisper" aria-pressed="false">
              <b>Whisper</b><small>air-heavy + soft</small>
            </button>
            <button type="button" data-personality="reed" aria-pressed="false">
              <b>Reed</b><small>pinched + electric</small>
            </button>
            <button type="button" data-personality="creature" aria-pressed="false">
              <b>Creature</b><small>low + uncanny</small>
            </button>
          </div>
        </section>

        <section class="spelling-control-block" aria-labelledby="flowLabel">
          <header>
            <span><b id="flowLabel">Typing flow</b><small>turn keystroke timing into prosody</small></span>
          </header>

          <label class="spelling-range" for="rhythmAmount">
            <span><b>Rhythm → dynamics</b><output id="rhythmAmountOut" for="rhythmAmount">72%</output></span>
            <input id="rhythmAmount" type="range" min="0" max="1" step="0.01" value="0.72" />
            <small><i>even</i><i>expressive</i></small>
          </label>

          <label class="spelling-range" for="diphthongDelay">
            <span><b>Letter-pair timing</b><output id="diphthongDelayOut" for="diphthongDelay">180 ms</output></span>
            <input id="diphthongDelay" type="range" min="0" max="320" step="5" value="180" />
            <small><i>snappier</i><i>more joins</i></small>
          </label>

          <button
            class="spelling-switch"
            id="pairGlidesButton"
            type="button"
            role="switch"
            aria-checked="true"
            aria-labelledby="pairGlidesLabel pairGlidesState"
          >
            <span><b id="pairGlidesLabel">Join letter pairs</b><small>digraphs · soft C/G · vowel pairs</small></span>
            <i aria-hidden="true"></i>
            <strong id="pairGlidesState">on</strong>
          </button>
        </section>

        <p class="spelling-notes-link"><a href="docs/spelling-synthesizer.md">Voice engines &amp; controls</a> · <a href="throatazoid.html">Throatazoid</a></p>

        <p class="audio-error" id="audioError" role="alert" hidden></p>
        <div class="reset-all-row">
          <button
            class="reset-all-button"
            id="resetButton"
            type="button"
            data-reset-all
            data-reset-in-place
          >Reset Spelling Synthesizer</button>
        </div>
      </aside>

      <p class="sr-only" id="liveStatus" aria-live="polite"></p>
    </main>

    <script type="module" src="nav.js"></script>
    <script type="module" src="src/instruments/spelling-synthesizer/spelling-synthesizer-app.js"></script>
    <script type="module" src="wax/wax-universal-adapter.js" data-morphazoid-wax-universal-adapter></script>
</body>
</html>
